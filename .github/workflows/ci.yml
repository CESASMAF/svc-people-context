name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  validate:
    name: Typecheck, tests, and coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun ci

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests with coverage
        run: bun run coverage

  integration:
    name: Repository integration (Bun.sql + Postgres)
    runs-on: ubuntu-latest
    # Não bloqueia o PR por flakiness de infra (ex.: timeout no pull do Docker Hub da
    # imagem postgres:15). O gate forte é o job `validate` (typecheck/tests/coverage).
    continue-on-error: true
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: people
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun ci

      # Oráculo da migração postgres.js → Bun.sql (T-SQL-NATIVE): exercita os
      # repositories reais contra Postgres. Gated por PG_INTEGRATION.
      - name: Repository integration tests
        run: PG_INTEGRATION=1 bun test tests/repository/
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: people

  sbom:
    name: SBOM
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: validate
    uses: acdgbrasil/.github/.github/workflows/reusable-sbom.yml@main
    permissions:
      contents: write

# NOTA: o Kodus (review de IA) foi DESCONTINUADO no projeto. O job `kodus-review`
# e o reusable workflow da org foram removidos — não há o que reativar. Se um dia
# entrar outra ferramenta de review automatizado, ela vem como job novo.
#
# Histórico: o job chamava `acdgbrasil/.github/.../reusable-kodus-review.yml`
# passando `secrets.KODUS_TEAM_KEY`, que nunca existiu na org CESASMAF — a chave
# chegava vazia e TODO pull request nascia com um check vermelho, desde o
# primeiro PR do repo. Como só rodava em `pull_request`, a `main` parecia verde.
